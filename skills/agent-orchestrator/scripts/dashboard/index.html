<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Agent Orchestrator</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="app.css"></head><body>
<header><h1><svg class="logo" viewBox="18 18 64 64" aria-hidden="true"><path d="M63,21.42a2,2,0,0,0-2.79-1.2c-1.17.56-1.31,1.78-.75,3l9.11,22.73c.55,1.18,1.59,1.88,2.75,1.32a2.2,2.2,0,0,0,.79-3.09Z"/><path d="M50.25,37.19c5.14,0,9.26,4.68,9.26,10.46s-4.12,10.47-9.26,10.47S41,53.44,41,47.65,45.11,37.19,50.25,37.19Z"/><path d="M28.89,60.43l13.34,1.5L45.3,80H41.5a2.34,2.34,0,0,1-2.24-1.73l-2.72-9.8L25.18,67.19a6,6,0,0,1-4.85-7.87l5.86-17.08a3.49,3.49,0,0,1,4.47-2.19,3.58,3.58,0,0,1,2.15,4.54l-4.9,14.27A1.18,1.18,0,0,0,28.89,60.43Z"/><path d="M59.21,80h-4l3-17.86,12.61,2.39a1.19,1.19,0,0,0,1.36-1.43l-1.79-8A3.58,3.58,0,0,1,73,50.8a3.5,3.5,0,0,1,4.23,2.63L79.83,65a5.9,5.9,0,0,1-6.72,7.25l-9.63-1.82-2,7.84A2.33,2.33,0,0,1,59.21,80Z"/><path d="M46.64,64.11a1.37,1.37,0,0,1-2.1-1.19V60.71a1.37,1.37,0,0,1,2.1-1.19l3.61,2.3Z"/><path d="M50.25,61.82l3.6-2.3A1.38,1.38,0,0,1,56,60.71v2.21a1.38,1.38,0,0,1-2.11,1.19Z"/></svg>Agent Orchestrator</h1><span id="stamp" class="live" title="connecting"></span><span id="need" role="button" tabindex="0" title="Show attention and enable browser notifications" hidden></span><span class="muted" id="grand"></span><span id="limits"></span><span id="disk" class="disk"></span></header>
<main class="no-detail"><section id="runs"><p class="muted empty">Loading sessions…</p></section><div id="splitter" title="Drag to resize; double-click to reset"></div><section id="detail"><p class="muted">Select a session to see its details and live event log.</p></section><form id="compose" hidden><label for="compose-text" id="compose-title"></label><p id="compose-note" class="muted" hidden></p><div id="compose-reply" hidden></div><div id="compose-queue" hidden></div><div id="compose-files" hidden></div><textarea id="compose-text" rows="3" placeholder="Send this agent a message"></textarea><div class="crow"><button type="button" id="compose-attach" title="Attach images (PNG, JPEG, GIF or WebP; up to 4, 5 MB each). You can also paste or drop them." aria-label="Attach images">Image</button><input type="file" id="compose-file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden><label class="steer" title="Interrupt: deliver your message now. In a shell command, that command is stopped (never a commit, push or other publishing command); otherwise its session is stopped and resumed with your message. Unticked, it reads the message after its current step; an agent that ended its turn and waits on its own background command is interrupted either way."><input type="checkbox" id="compose-steer" checked> Interrupt</label><span class="grow"></span><button type="submit" id="compose-send" title="Enter sends; Shift+Enter adds a line">Send</button></div><div id="compose-status" role="status"></div></form></main>
<div id="jump"><button id="jump-top" title="Scroll to the top" aria-label="Scroll to the top" hidden>↑</button><button id="jump-bottom" title="Scroll to the newest events" aria-label="Scroll to the bottom" hidden>↓</button></div>
<script src="app.js"></script></body></html>
